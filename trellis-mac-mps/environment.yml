# Conda environment for running TRELLIS natively on Apple Silicon (MPS), no CUDA.
# Usage:
#   conda env create -f environment.yml
#   conda activate trellis-mac-mps
#   export SPARSE_BACKEND=pytorch ATTN_BACKEND=sdpa   # required before importing trellis
#   python3 cli.py generate assets/example_image/typical_creature_dragon.png dragon
#
# See APPLE_SILICON.md for the full narrative (why each package is needed, what was ported,
# verification methodology) and README.md's "Apple Silicon quick start" for the brew-based path.
name: trellis-mac-mps
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch==2.13.0
      - numpy==2.4.6
      - pillow==12.2.0
      - trimesh==4.12.2
      - xatlas==0.0.11
      - pyvista==0.48.4
      - pymeshfix==0.18.1
      - python-igraph==1.0.0
      - opencv-python==5.0.0.93
      - plyfile==1.1.4
      - easydict==1.13
      - tqdm==4.68.2
      - flask==3.1.3
      - pyobjc-framework-Metal==12.2.1
      - pyobjc-framework-Cocoa==12.2.1
      - git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8
